# .github/workflows/pre-merge.yml — the pre-merge gate.
#
# Runs on every pull request into a version branch (release/vX.Y) or into main.
# Each job below is a *required status check* in branch protection, so GitHub's Merge button stays
# disabled until all of them are green.
#
# Concept — GitHub Actions: each `job` runs on a fresh Linux machine; jobs run in parallel unless
# `needs:` says otherwise. `steps` run in order inside a job.
#
# The commands are Makefile targets, so CI runs exactly what you run locally.

name: pre-merge

on:
  pull_request:
    branches: [main, "release/**"]

# A new push to the same PR cancels the run still going for the previous push.
concurrency:
  group: pre-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least privilege: jobs can read code and PR metadata, nothing else.
# pull-requests: read is needed by the secret scan to list the PR's commits (bug KQ-24).
permissions:
  contents: read
  pull-requests: read

jobs:
  conventions:
    name: 1. Conventions (branch, PR title, Jira key)
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name and PR title
        # Values go through env vars, never pasted into the script, so a crafted PR title can't inject shell commands.
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -e
          if [[ "$BASE" == main ]]; then
            # Into main: only a version branch or a hotfix
            [[ "$HEAD" =~ ^(release/v[0-9]+\.[0-9]+|hotfix/[A-Z][A-Z0-9]+-[0-9]+-.+)$ ]] \
              || { echo "::error::Only release/vX.Y or hotfix/KEY-n-* may merge into main (got '$HEAD')"; exit 1; }
          else
            # Into a version branch: work branches carrying a Jira key
            [[ "$HEAD" =~ ^(feature|bugfix|refactor|chore|docs)/[A-Z][A-Z0-9]+-[0-9]+-.+$ ]] \
              || { echo "::error::Branch must be <type>/<KEY>-<num>-desc (got '$HEAD')"; exit 1; }
          fi
          # PR title: conventional commit + Jira key(s), e.g. "feat(quiz): add round pause (KQ-12)" or "(KQ-3, KQ-23)"
          [[ "$TITLE" =~ ^(feat|fix|refactor|test|docs|chore|style|perf|release)(\(.+\))?:\ .+\([A-Z][A-Z0-9]+-[0-9]+(,\ ?[A-Z][A-Z0-9]+-[0-9]+)*\)$ ]] \
            || { echo "::error::PR title must be 'type(scope): description (KEY-123)'"; exit 1; }
          echo "Conventions OK"

  rtl-check:
    name: 2. RTL check (no physical left/right styling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: make rtl-check

  secrets:
    name: 3. Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # full history, so a secret committed and then deleted is still found
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: 4. Lint + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: make lint
      - run: make typecheck

  unit:
    name: 5. Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: make test-unit

  integration:
    name: 6. Integration tests
    runs-on: ubuntu-latest
    # A real Supabase stack (Postgres, auth, realtime, API) runs in Docker on the CI machine.
    # `supabase start` applies every file in supabase/migrations, so tests see the exact schema
    # the cloud project will get.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: make db-start
      - run: make db-types-check   # generated DB types must match the migrations
      - run: make test-integration
      - if: always()
        run: make db-stop

  build:
    name: 7. Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: make build

  e2e:
    name: 8. E2E (smoke → version branch, full → main)
    needs: [quality, unit, integration, build] # only spend time on browser tests once the basics pass
    runs-on: ubuntu-latest
    env:
      E2E_SCOPE: ${{ github.base_ref == 'main' && 'full' || 'smoke' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The app under test needs a database: start local Supabase (with the demo seed) and point
      # the app at it. Values written to $GITHUB_ENV are visible to all later steps of this job.
      - run: make db-start
      - run: node scripts/supabase-env.mjs >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      # The app server's log is part of the output ([WebServer] lines). Keep a copy and fail on
      # render errors even when the tests themselves pass (regression guard for bug KQ-27).
      - name: Run E2E and check the server log
        run: |
          set -o pipefail
          make test-e2e 2>&1 | tee e2e-output.log
          if grep -E "\[WebServer\] (Error|⨯)" e2e-output.log; then
            echo "::error::The app server logged errors during E2E (see lines above)"; exit 1
          fi
          # KQ-19: phone numbers must never reach a log. The E2E tests join with 054-777-0019;
          # look for it in our server's output and in every Supabase container's log.
          for name in $(docker ps --format '{{.Names}}' | grep supabase); do docker logs "$name" >> service-logs.txt 2>&1; done
          if grep -E "054-?777-?0019|9725477700?19" e2e-output.log service-logs.txt; then
            echo "::error::A test phone number appeared in a log"; exit 1
          fi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
