# .github/workflows/db-deploy.yml — applies new migrations to the CLOUD Supabase project.
#
# When: after a merge lands on a version branch (release/vX.Y) or main — i.e. only code that
# already passed the pre-merge gate. See docs/decisions/0002-database-environments.md for why
# version branches deploy too (Vercel previews use the same cloud database).
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   personal access token (supabase.com → Account → Access Tokens)
#   SUPABASE_DB_PASSWORD    the database password chosen when the project was created
# Variable (same page, "Variables" tab):
#   SUPABASE_PROJECT_REF    the project ref, e.g. abcdefghijklmnop (from the project URL)
#
# GitHub hides secret values in logs automatically.

name: db-deploy

on:
  push:
    branches: [main, "release/**"]
    paths: ["supabase/migrations/**"]   # only when a migration changed
  workflow_dispatch: {}                 # "Run workflow" button for a manual deploy

# Never run two deploys at once; a second one waits for the first.
concurrency:
  group: db-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply migrations to Supabase cloud
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # --remote=<ref> targets the cloud project directly (CLI v3), no separate `link` step needed.
      - name: Show migration status (local files vs. cloud)
        run: npx supabase migration list --remote="$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply pending migrations
        run: npx supabase db push --remote="$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes
